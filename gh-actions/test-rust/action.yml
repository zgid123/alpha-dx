name: Test Rust

description: Check formatting, run clippy, and run tests for a Rust crate or workspace

inputs:
  package:
    description: Optional Cargo package name (-p <package>). Leave empty to test the entire workspace.
    required: false
    default: ''
  working-directory:
    description: Working directory containing Cargo.toml
    required: false
    default: '.'
  clippy-args:
    description: Extra arguments passed to cargo clippy before -- -D warnings (for example --all-features)
    required: false
    default: ''
  test-args:
    description: Extra arguments passed to cargo test (for example --all-features)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check formatting
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        set -euo pipefail
        if [ -n "${PACKAGE:-}" ]; then
          cargo fmt -p "$PACKAGE" --check
        else
          cargo fmt --all --check
        fi

    - name: Lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE: ${{ inputs.package }}
        CLIPPY_ARGS: ${{ inputs.clippy-args }}
      run: |
        set -euo pipefail
        set -f
        if [ -n "${PACKAGE:-}" ]; then
          set -- -p "$PACKAGE" --all-targets
        else
          set -- --workspace --all-targets
        fi
        for arg in ${CLIPPY_ARGS:-}; do
          set -- "$@" "$arg"
        done
        cargo clippy "$@" -- -D warnings

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE: ${{ inputs.package }}
        TEST_ARGS: ${{ inputs.test-args }}
      run: |
        set -euo pipefail
        set -f
        if [ -n "${PACKAGE:-}" ]; then
          set -- -p "$PACKAGE"
        else
          set -- --workspace
        fi
        for arg in ${TEST_ARGS:-}; do
          set -- "$@" "$arg"
        done
        cargo test "$@"
